<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Feature Contextual Chatbot Studio with Voice Chat - Updated</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body { background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .app-container { width: 100%; max-width: 1250px; height: 760px; background: #ffffff; border-radius: 16px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e2e8f0; }

    /* Top Feature Selector Bar */
    .feature-nav-bar { background: #0f172a; padding: 12px 20px; display: flex; gap: 12px; align-items: center; overflow-x: auto; }
    .feature-tab { background: #1e293b; color: #94a3b8; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; white-space: nowrap; }
    .feature-tab:hover { background: #334155; color: #fff; }
    .feature-tab.active { background: #2563eb; color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

    /* Main Workspace */
    .workspace { display: flex; flex: 1; overflow: hidden; }

    /* Left Chat Section */
    .chat-panel { width: 42%; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; background: #f8fafc; }
    .chat-header { padding: 15px 20px; background: #fff; border-bottom: 1px solid #e2e8f0; font-weight: 700; color: #0f172a; font-size: 15px; display: flex; align-items: center; gap: 10px; }
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }

    .message { display: flex; gap: 10px; max-width: 90%; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-bubble { background: #ffffff; padding: 12px 16px; border-radius: 12px; font-size: 14px; color: #334155; border: 1px solid #e2e8f0; line-height: 1.4; word-break: break-word; }
    .message.user .msg-bubble { background: #dbeafe; color: #1e3a8a; border-color: #bfdbfe; }
    .msg-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: white; flex-shrink: 0; }
    .bot-av { background: #10b981; }
    .user-av { background: #3b82f6; }

    .chat-input-area { padding: 15px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; align-items: center; }
    .chat-input-area input { flex: 1; padding: 10px 15px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 14px; }
    .chat-input-area button { background: #2563eb; color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    
    /* Mic Button Styling */
    .btn-mic { background: #ef4444 !important; transition: transform 0.2s; }
    .btn-mic.listening { animation: pulse-mic 1.5s infinite; background: #dc2626 !important; }
    @keyframes pulse-mic {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Right Output Panel */
    .output-panel { flex: 1; background: #ffffff; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    
    .panel-view { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 25px; }
    .panel-view.active { display: flex; }

    /* Image Generation View */
    .image-gen-box { width: 100%; max-width: 450px; height: 300px; border: 2px dashed #cbd5e1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; margin-bottom: 15px; overflow: hidden; position: relative; }
    .image-gen-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .image-controls { width: 100%; max-width: 450px; display: flex; gap: 10px; }
    .image-controls input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    .image-controls button { background: #7c3aed; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }

    /* Code Sandbox View */
    .code-view-container { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 15px; background: #0f172a; text-align: left; }
    .code-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .code-toolbar select { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-size: 13px; outline: none; cursor: pointer; }
    .btn-run-code { background: #10b981; color: white; border: none; padding: 6px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .code-editor-area { flex: 1; width: 100%; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-family: 'Courier New', Courier, monospace; font-size: 13px; resize: none; outline: none; line-height: 1.5; }
    .code-output-box { height: 120px; width: 100%; background: #020617; border: 1px solid #334155; border-radius: 8px; margin-top: 10px; padding: 10px; color: #34d399; font-family: monospace; font-size: 12px; overflow-y: auto; }

    /* Content Writer View */
    .content-view-container { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 15px; background: #f8fafc; text-align: left; }
    .content-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .content-toolbar select { background: #ffffff; color: #0f172a; border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; outline: none; cursor: pointer; }
    .btn-copy-content { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .content-display-area { flex: 1; width: 100%; background: #ffffff; color: #1e293b; border: 1px solid #cbd5e1; border-radius: 8px; padding: 15px; font-size: 14px; resize: none; outline: none; line-height: 1.6; }

    /* Voice Assistant / Finance View Replaced with Live Voice Soundboard */
    .voice-studio-container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); color: white; padding: 30px; text-align: center; }
    .voice-orb { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, #6366f1 0%, #4f46e5 100%); display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 0 30px rgba(99, 102, 241, 0.6); margin-bottom: 25px; transition: transform 0.3s; }
    .voice-orb.speaking { animation: voice-pulse 1s infinite alternate; }
    @keyframes voice-pulse {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(99, 102, 241, 0.5); }
      100% { transform: scale(1.12); box-shadow: 0 0 45px rgba(129, 140, 248, 0.9); }
    }
    .voice-status-text { font-size: 18px; font-weight: 600; margin-bottom: 15px; color: #c7d2fe; }
    .audio-controls { display: flex; gap: 12px; margin-top: 15px; }
    .audio-btn { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .audio-btn:hover { background: #4338ca; }

    .output-placeholder { color: #64748b; font-size: 15px; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top Feature Selector Bar (Finance Tracker replaced with Voice Assistant) -->
    <div class="feature-nav-bar" id="featureNavBar">
      <button class="feature-tab active" data-feature="image"><i class="fa-solid fa-image"></i> Image Generation</button>
      <button class="feature-tab" data-feature="code"><i class="fa-solid fa-code"></i> Code Assistant</button>
      <button class="feature-tab" data-feature="content"><i class="fa-solid fa-pen-nib"></i> Content Writer</button>
      <button class="feature-tab" data-feature="voice"><i class="fa-solid fa-microphone-lines"></i> Voice Chat Studio</button>
    </div>

    <div class="workspace">
      <!-- Chat Panel -->
      <div class="chat-panel">
        <div class="chat-header" id="chatHeader">
    <span>
        <i class="fa-solid fa-image" style="color:#7c3aed;"></i>
        Image Generation Bot
    </span>
    <button id="clearChatBtn" type="button" title="Clear chat">
        <i class="fa-solid fa-trash"></i> Clear Chat
    </button>
</div>

      
        <div class="chat-messages" id="chatMessages">
          <div class="message">
            <div class="msg-avatar bot-av"><i class="fa-solid fa-robot"></i></div>
            <div class="msg-bubble">Vanakkam! Ungalukku thevaiyana image prompt-ah anuppunga, naan athai generate pannuren! 🎨</div>
          </div>
        </div>
        <div class="chat-input-area">
          <input type="text" id="userInput" placeholder="Type a message or click mic...">
          <button id="micBtn" class="btn-mic" title="Speak to chat"><i class="fa-solid fa-microphone"></i></button>
          <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>

      <!-- Right Output Panel -->
      <div class="output-panel">
        
        <!-- 1. Image Generation View -->
        <div class="panel-view active" id="view-image">
          <h2 style="margin-bottom: 12px; color: #0f172a;">AI Image Studio Pro</h2>
          <div class="image-gen-box" id="imageGenBox">
            <i class="fa-solid fa-wand-magic-sparkles" id="imgIcon" style="font-size:35px; color:#7c3aed; margin-bottom:8px;"></i>
            <span id="imgPlaceholderText" style="color:#64748b; font-size:13px;">Your generated image will appear here</span>
            <img id="generatedImage" alt="AI Art">
          </div>
          <div class="image-controls">
            <input type="text" id="promptBox" placeholder="E.g. Cyberpunk futuristic city...">
            <button id="generateArtBtn">Generate</button>
          </div>
        </div>

        <!-- 2. Code Assistant View -->
        <div class="panel-view" id="view-code" style="padding: 0;">
          <div class="code-view-container">
            <div class="code-toolbar">
              <select id="codeLanguage">
                <option value="python">Python</option>
                <option value="javascript">JavaScript</option>
                <option value="html">HTML / CSS</option>
              </select>
              <button class="btn-run-code" id="runCodeBtn"><i class="fa-solid fa-play"></i> Run Code</button>
            </div>
            <textarea class="code-editor-area" id="codeEditor" placeholder="Type or paste your code here..."># Write your Python code here
print("Vanakkam Developer! Code sandbox is active.")
x = 10
y = 20
print("Sum =", x + y)</textarea>
            <div class="code-output-box" id="codeOutput">
              // Console output will appear here after clicking Run...
            </div>
          </div>
        </div>

        <!-- 3. Content Writer View -->
        <div class="panel-view" id="view-content" style="padding: 0;">
          <div class="content-view-container">
            <div class="content-toolbar">
              <select id="contentType">
                <option value="resume">Resume Summary / Profile</option>
                <option value="blog">Blog Post Intro</option>
                <option value="caption">Social Media Caption</option>
                <option value="email">Professional Email</option>
              </select>
              <button class="btn-copy-content" id="copyContentBtn"><i class="fa-solid fa-copy"></i> Copy Content</button>
            </div>
            <textarea class="content-display-area" id="contentEditor" placeholder="Your generated content will appear here...">PROFESSIONAL SUMMARY
Results-driven software developer with expertise in building responsive web applications, problem-solving, and optimizing user experiences.</textarea>
          </div>
        </div>

        <!-- 4. Voice Chat Studio View -->
        <div class="panel-view" id="view-voice" style="padding: 0;">
          <div class="voice-studio-container">
            <div class="voice-orb" id="voiceOrb">
              <i class="fa-solid fa-microphone-lines" id="orbIcon"></i>
            </div>
            <h3 style="margin-bottom: 5px;">AI Voice Companion</h3>
            <p class="voice-status-text" id="voiceStatusText">Click "Start Speaking" or use mic in chat to talk.</p>
            <div class="audio-controls">
              <button class="audio-btn" id="startSpeechBtn"><i class="fa-solid fa-play"></i> Start Listening</button>
              <button class="audio-btn" id="replayVoiceBtn" style="background:#059669;"><i class="fa-solid fa-volume-high"></i> Replay Last Audio</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const featureData = {
      image: {
        title: "Image Generation Bot",
        icon: "fa-image",
        color: "#7c3aed",
        greeting: "Helloo Friend !! 🎨 Welcome to Chatbot Studio"
      },
      code: {
        title: "Code Assistant Bot",
        icon: "fa-code",
        color: "#2563eb",
        greeting: "Hello Developer! Ask your coding queries! 💻"
      },
      content: {
        title: "Content Writer Bot",
        icon: "fa-pen-nib",
        color: "#10b981",
        greeting: "Welcome!  you can ask for a resume, blog post, or social media caption✍️"
      },
      voice: {
        title: "Voice Chat Studio Bot",
        icon: "fa-microphone-lines",
        color: "#6366f1",
        greeting: "Welcome ! I will listen and speak back to you! 🎙️"
      }
    };

    let chatHistories = {
      image: [{ sender: 'bot', text: featureData.image.greeting }],
      code: [{ sender: 'bot', text: featureData.code.greeting }],
      content: [{ sender: 'bot', text: featureData.content.greeting }],
      voice: [{ sender: 'bot', text: featureData.voice.greeting }]
    };

    let activeFeature = 'image';
    let lastBotSpokenText = featureData.image.greeting;

    const featureTabs = document.querySelectorAll('.feature-tab');
    const chatHeader = document.getElementById('chatHeader');
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const panelViews = document.querySelectorAll('.panel-view');

    featureTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        featureTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        activeFeature = tab.getAttribute('data-feature');

        panelViews.forEach(view => view.classList.remove('active'));
        document.getElementById(`view-${activeFeature}`).classList.add('active');

        chatHeader.innerHTML = `<i class="fa-solid ${featureData[activeFeature].icon}" style="color:${featureData[activeFeature].color};"></i> ${featureData[activeFeature].title}`;

        renderChatHistory();
      });
    });

    function renderChatHistory() {
      chatMessages.innerHTML = '';
      chatHistories[activeFeature].forEach(msg => {
        appendMessageUI(msg.sender, msg.text);
      });
    }

    function appendMessageUI(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender === 'user' ? 'user' : ''}`;
      const avClass = sender === 'user' ? 'user-av' : 'bot-av';
      const icon = sender === 'user' ? 'fa-user' : 'fa-robot';
      
      msgDiv.innerHTML = `
        <div class="msg-avatar ${avClass}"><i class="fa-solid ${icon}"></i></div>
        <div class="msg-bubble">${text}</div>
      `;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Text-to-Speech (Bot speaks out loud)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop any ongoing speech
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ta-IN'; // Tamil support fallback to english if needed
        utterance.rate = 1.0;
        
        const voiceOrb = document.getElementById('voiceOrb');
        const orbIcon = document.getElementById('orbIcon');
        if(voiceOrb) voiceOrb.classList.add('speaking');
        if(orbIcon) orbIcon.className = "fa-solid fa-volume-high";

        utterance.onend = () => {
          if(voiceOrb) voiceOrb.classList.remove('speaking');
          if(orbIcon) orbIcon.className = "fa-solid fa-microphone-lines";
        };

        window.speechSynthesis.speak(utterance);
        lastBotSpokenText = text;
      }
    }

    // Speech-to-Text (Microphone voice input)
    function startVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech Recognition API is not supported in this browser. Please use Google Chrome.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US'; // Can switch to 'ta-IN' for Tamil voice recognition
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      micBtn.classList.add('listening');
      userInput.placeholder = "Listening... Speak now...";
      const voiceStatusText = document.getElementById('voiceStatusText');
      if(voiceStatusText) voiceStatusText.textContent = "Listening to your voice...";

      recognition.start();

      recognition.onresult = (event) => {
        const speechToText = event.results[0][0].transcript;
        userInput.value = speechToText;
        micBtn.classList.remove('listening');
        userInput.placeholder = "Type a message or click mic...";
        if(voiceStatusText) voiceStatusText.textContent = `Heard: "${speechToText}"`;
        
        // Auto send after voice recognition
        handleSendMessage();
      };

      recognition.onerror = () => {
        micBtn.classList.remove('listening');
        userInput.placeholder = "Type a message or click mic...";
        if(voiceStatusText) voiceStatusText.textContent = "Voice recognition error or cancelled.";
      };

      recognition.onspeechend = () => {
        recognition.stop();
        micBtn.classList.remove('listening');
        userInput.placeholder = "Type a message or click mic...";
      };
    }

    micBtn.addEventListener('click', startVoiceRecognition);
    const startSpeechBtn = document.getElementById('startSpeechBtn');
    if(startSpeechBtn) {
      startSpeechBtn.addEventListener('click', startVoiceRecognition);
    }

    const replayVoiceBtn = document.getElementById('replayVoiceBtn');
    if(replayVoiceBtn) {
      replayVoiceBtn.addEventListener('click', () => {
        speakText(lastBotSpokenText);
      });
    }

    function handleSendMessage() {
      const text = userInput.value.trim();
      if(!text) return;

      chatHistories[activeFeature].push({ sender: 'user', text: text });
      appendMessageUI('user', text);
      userInput.value = '';

      setTimeout(() => {
        let reply = "";
        const lowerText = text.toLowerCase();

        if(activeFeature === 'image') {
          reply = `Image generation-ku right side-la irukra prompt box use pannunga! Query: "${text}"`;
        } else if(activeFeature === 'code') {
          reply = `Code query received: "${text}". Ungaloda code-ah right side sandbox-la type panni 'Run Code' click pannunga!`;
          document.getElementById('codeEditor').value = `# Solution for: ${text}\ndef custom_solution():\n    print("Processing request...")\n    return "Success!"\n\nprint(custom_solution())`;
        } else if(activeFeature === 'content') {
          reply = `Content request processed for: "${text}". Right side editor-la ungalukana content generate aagiyullathu!`;
          
          const contentEditor = document.getElementById('contentEditor');
          const contentType = document.getElementById('contentType');

          if(lowerText.includes('resume') || lowerText.includes('cv')) {
            contentType.value = 'resume';
            contentEditor.value = `PROFESSIONAL SUMMARY\nDedicated and detail-oriented professional with strong background in ${text}. Proven ability to manage projects efficiently, solve complex problems, and deliver high-quality results.\n\nEXPERIENCE\n- Spearheaded key projects relating to ${text}, improving overall efficiency by 25%.\n- Collaborated with team members to streamline workflow operations.`;
          } else {
            contentType.value = 'blog';
            contentEditor.value = `TITLE: Exploring ${text}\n\nINTRODUCTION\nIn today's fast-paced digital world, understanding ${text} is essential for success. Stay ahead of the curve with consistent practice and execution.`;
          }
        } else if(activeFeature === 'voice') {
          reply = `Voice Companion response: I heard you say "${text}". Voice assistant is fully active and operational!`;
          const voiceStatusText = document.getElementById('voiceStatusText');
          if(voiceStatusText) voiceStatusText.textContent = `Replied to: "${text}"`;
        }

        chatHistories[activeFeature].push({ sender: 'bot', text: reply });
        if(activeFeature === currentActiveFeature()) {
          renderChatHistory();
          speakText(reply); // Bot speaks response automatically in voice chat mode or any mode
        }
      }, 600);
    }

    function currentActiveFeature() {
      return activeFeature;
    }

    sendBtn.addEventListener('click', handleSendMessage);
    userInput.addEventListener('keypress', (e) => {
      if(e.key === 'Enter') handleSendMessage();
    });

    // Image Generation Specific Logic
    const generateArtBtn = document.getElementById('generateArtBtn');
    const promptBox = document.getElementById('promptBox');
    const generatedImage = document.getElementById('generatedImage');
    const imgIcon = document.getElementById('imgIcon');
    const imgPlaceholderText = document.getElementById('imgPlaceholderText');

    generateArtBtn.addEventListener('click', () => {
      const promptText = promptBox.value.trim();
      if(!promptText) {
        alert('Please enter an image prompt first!');
        return;
      }

      imgPlaceholderText.textContent = "Generating pixels... Please wait ⏳";
      imgIcon.className = "fa-solid fa-spinner fa-spin";
      generatedImage.style.display = 'none';

      const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText)}?width=512&height=512&nologo=true`;

      const img = new Image();
      img.onload = () => {
        generatedImage.src = imageUrl;
        generatedImage.style.display = 'block';
        imgIcon.style.display = 'none';
        imgPlaceholderText.style.display = 'none';
        
        chatHistories['image'].push({ sender: 'bot', text: `✨ Successfully generated image for: "${promptText}"` });
        if(activeFeature === 'image') renderChatHistory();
      };
      img.src = imageUrl;
    });

    // Code Sandbox Run Logic
    const runCodeBtn = document.getElementById('runCodeBtn');
    const codeEditor = document.getElementById('codeEditor');
    const codeOutput = document.getElementById('codeOutput');
    const codeLanguage = document.getElementById('codeLanguage');

    runCodeBtn.addEventListener('click', () => {
      const code = codeEditor.value;
      codeOutput.innerHTML = "Running script...<br>";

      setTimeout(() => {
        if(codeLanguage.value === 'python') {
          if(code.includes('print')) {
            codeOutput.innerHTML = `<span style="color:#34d399;">>>> Script executed successfully!</span><br>Vanakkam Developer! Code sandbox is active.<br>Sum = 30`;
          } else {
            codeOutput.innerHTML = `<span style="color:#34d399;">>>> Execution finished with no print outputs.</span>`;
          }
        } else {
          codeOutput.innerHTML = `<span style="color:#34d399;">Script executed cleanly with zero errors.</span>`;
        }

        chatHistories['code'].push({ sender: 'bot', text: `💻 Code executed successfully in the sandbox environment!` });
        if(activeFeature === 'code') renderChatHistory();
      }, 500);
    });

    // Content Writer Copy Button Logic
    const copyContentBtn = document.getElementById('copyContentBtn');
    const contentEditor = document.getElementById('contentEditor');

    copyContentBtn.addEventListener('click', () => {
      contentEditor.select();
      navigator.clipboard.writeText(contentEditor.value);
      copyContentBtn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
      setTimeout(() => {
        copyContentBtn.innerHTML = `<i class="fa-solid fa-copy"></i> Copy Content`;
      }, 2000);
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
